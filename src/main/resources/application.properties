spring.application.name=ms-usuarios

# Configuración del Servidor y Puerto del Microservicio
server.port=8081

# Configuración de la Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ms-usuarios
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

excepciones.base-url=http://localhost:8082

logging.pattern.level=%5p [traceId:%X{traceId:-}]

jwt.secret=${JWT_SECRET:athenea-books-dev-secret-key-32b}
jwt.expiration-ms=3600000